<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Juniper Lane Admin: revenue, orders and customers for the Juniper Lane online homeware shop."
    />
    <meta name="theme-color" content="#12302c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Juniper Lane Admin</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colours.
      (function () {
        var theme = 'light';
        try {
          var saved = JSON.parse(localStorage.getItem('jl:theme') || '"system"');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = saved === 'dark' || (saved !== 'light' && prefersDark) ? 'dark' : 'light';
        } catch (error) {
          theme = 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <noscript>Juniper Lane Admin needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
